name: CI

on:
  push:
    # prerelease.yml runs these checks for main before it publishes a prerelease
    branches-ignore: [main]
  workflow_call: {}

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Mise install
      uses: jdx/mise-action@v5
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Run shellcheck
      run: task test:shellcheck

    - name: Build
      run: task build

    - name: Run Unit Test
      run: task test:unit

    - name: Check the catalog
      run: task test:catalog

    - name: Run vulnerabilities check
      run: task test:vulnerabilities

  combinations:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Install Task
      run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

    - name: Install gotestsum
      run: go install gotest.tools/gotestsum@v1.13.0

    - name: Mise install
      uses: jdx/mise-action@v5
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        otp-version: '29.1'
        elixir-version: '1.20.4'

    # generator-catalog.yml tests the latest phx_new, so that a new release cannot fail this push
    - name: Install phx_new
      run: mix archive.install hex phx_new 1.8.17 --force

    - name: Make and test the repo of each combination of the catalog
      run: task test:combinations

  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Task
      uses: arduino/setup-task@v3
      with:
        version: 3.x
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Run E2E Test
      run: task test:e2e
