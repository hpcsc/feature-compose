name: Generator catalog

on:
  schedule:
    # a new version of a generator can change its files with no commit in this repo
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:

  phoenix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ['', '--feature oban']
    services:
      db:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Mise install
      uses: jdx/mise-action@v5
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache the tools that the starters pin in mise.toml
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/share/mise/installs/erlang
          ~/.local/share/mise/installs/elixir
        key: pinned-tools-${{ runner.os }}-${{ hashFiles('catalog/starters/*/files/*/mise.toml') }}

    - name: Make the repo with the latest phx_new
      env:
        FEATURES: ${{ matrix.features }}
      run: |
        # FEATURES holds a flag and its value, so it is split on purpose
        # shellcheck disable=SC2086
        go run ./cmd/feature-compose new phoenix lending-desk --catalog catalog --option phx-new-version=latest $FEATURES --no-prompt --output-dir "$RUNNER_TEMP/lending-desk"

    - name: Run the checks of the CI of the repo
      working-directory: ${{ runner.temp }}/lending-desk
      env:
        MISE_TRUSTED_CONFIG_PATHS: ${{ runner.temp }}
      run: |
        mise exec -- mix deps.unlock --check-unused
        MIX_ENV="test" mise exec -- mix compile --warnings-as-errors
        mise exec -- mix format --check-formatted
        mise exec -- mix xref.layers
        mise exec -- mix test
