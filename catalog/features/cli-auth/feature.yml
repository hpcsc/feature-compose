summary: The CLI sends the credential that the API asks for, in the method of api-auth, an API key or the access token of a login at the issuer.
targets: [go-event-sourcing-service]
needs: [cli, api-auth]

options:
  store-key:
    values: ["true", "false"]
    default: "false"
    when: api-auth.method == "api-key"

files:
  - path: files/common/
  - path: files/api-key/
    when: api-auth.method == "api-key"
  - path: files/oauth/
    when: api-auth.method == "oauth"
  - path: files/store/
    when: api-auth.method == "oauth"

add_to:
  cli.commands:
    - code: newAuthCommand()
  gomod.requires:
    - module: github.com/cli/browser
      version: v1.3.0
    - module: github.com/zalando/go-keyring
      version: v0.2.8
    - module: golang.org/x/oauth2
      version: v0.38.0
