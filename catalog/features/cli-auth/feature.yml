summary: The CLI sends the API key that the API asks for, which it takes from an environment variable or a credential command.
targets: [go-event-sourcing-service]
needs:
  cli:
  api-auth:
    method: api-key

files:
  - path: files/common/
  - path: files/api-key/
    when: api-auth.method == "api-key"
  - path: files/oauth/
    when: api-auth.method == "oauth"
  - path: files/store/
    when: api-auth.method == "oauth"

add_to:
  cli.commands:
    - code: newAuthCommand()
  gomod.requires:
    - module: github.com/cli/browser
      version: v1.3.0
    - module: github.com/zalando/go-keyring
      version: v0.2.8
    - module: golang.org/x/oauth2
      version: v0.38.0
