summary: A command line program with releases from GoReleaser, and a command that updates it.
targets: [go, go-event-sourcing-service]

files:
  - path: files/

add_to:
  taskfile.flat_includes:
    - name: cli
      taskfile: Taskfile.cli.yml
  mise.tools:
    - name: aqua:goreleaser/goreleaser
      version: "2.18.2"
    - name: node
      version: "26.10.0"
  gomod.requires:
    - module: github.com/fatih/color
      version: v1.19.0
    - module: github.com/mattn/go-isatty
      version: v0.0.24
    - module: github.com/urfave/cli/v3
      version: v3.14.0
  ci.jobs:
    - text: |-
        e2e:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v7

            - name: Install Task
              uses: arduino/setup-task@v3
              with:
                version: 3.x
                repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run E2E Test
              run: task test:e2e
  gitignore.patterns:
    - pattern: dist/
    - pattern: e2e/node_modules/

extension_points:
  cli.commands:
    summary: An expression of type *cli.Command.
    file: go/internal/cli/root.go
    item: [code]

delimiters:
  - glob: go/.goreleaser.yaml
    left: "[["
    right: "]]"
  - glob: go/Taskfile.cli.yml
    left: "[["
    right: "]]"
