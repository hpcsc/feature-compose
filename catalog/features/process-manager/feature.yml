summary: The example of a process manager, a payment to another bank, with fakes of its outside systems.
targets: [go-event-sourcing-service]

files:
  - path: files/

add_to:
  account.state:
    - name: holds
      type: map[uuid.UUID]hold
      apply: a.applyHold(e)
  account.events:
    - event: HoldPlaced
    - event: HoldRejected
    - event: HoldReleased
    - event: HoldCaptured
  balance.changes:
    - event: HoldCaptured
      amount: -payload.Amount
  api.routes:
    - code: paymentRoutables(bus, pool)
  catchup.config:
    - name: Outside
      type: outside.Config
      import: internal/use_cases/payment/outside
  catchup.consumers:
    - code: paymentWorkers(pool, cfg, logger, bus, eventStream, checkpointStore, eventSubscription)
  taskfile.includes:
    - name: fake_services
      taskfile: Taskfile.fake_services.yml
  tmux.panes:
    - command: task fake_services:run
  compose.catchup.environment:
    - name: FRAUD_SERVICE_URL
      value: http://fake_services:4444/fraud
    - name: SANCTIONS_SERVICE_URL
      value: http://fake_services:4444/sanctions
    - name: PAYMENT_NETWORK_URL
      value: http://fake_services:4444/network
    - name: WEBHOOK_URL
      value: http://api:3333/api/webhooks
  compose.services:
    - text: |-
        fake_services:
          build:
            dockerfile: Dockerfile.fake_services
  use_cases.events:
    - code: registerPaymentEvents(reg)
  use_cases.handlers:
    - code: registerPaymentHandlers(bus, stream, accounts)
