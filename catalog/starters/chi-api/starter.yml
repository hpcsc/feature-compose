summary: A Go HTTP API with chi, whose routes are under /api.

options:
  go-version:
    default: "1.27.1"
    pattern: '^1\.(2[7-9]|[3-9][0-9])(\.[0-9]+)?$'
  module:
    default: github.com/hpcsc/{{ .Name }}
    pattern: '^[A-Za-z0-9][A-Za-z0-9._~/-]*$'

folders:
  go:
    path: .
    after_render: [go mod tidy, gofmt -w .]
    test: [task test:unit]

extension_points:
  api.middleware:
    summary: An expression of type func(http.Handler) http.Handler, which each request to a protected route goes through. It can use cfg, the *config.Config of the API. import is the path of its package under the module.
    file: go/internal/server/server.go
    item: [code, import]
  api.config:
    summary: A field of config.Config, whose type the config loader reads with its env tags. import is the path of the package of its type under the module.
    file: go/internal/config/config.go
    item: [name, type, import]
  taskfile.flat_includes:
    summary: A Taskfile of a feature that Taskfile.yml includes with flatten, so that its tasks keep their own names. name is the key of the include, and taskfile is its path in the repo. A task name of the Taskfile must not be a task name of the starter.
    file: go/Taskfile.yml
    item: [name, taskfile]
  mise.tools:
    summary: A tool that mise install installs, with the name that mise.toml gives it and a fixed version.
    file: go/mise.toml
    item: [name, version]
  ci.jobs:
    summary: A job of the CI workflow, as YAML with the job name at the left edge. needs can name test, the job of the starter that runs its tests. The workflow runs on each push, with the permissions of the starter, so a job that writes sets its own permissions.
    file: go/.github/workflows/ci.yml
    item: [text]
  gomod.requires:
    summary: A module that the Go code of a feature imports and that the starter does not require, with a fixed version, so that go mod tidy takes no latest version.
    file: go/go.mod
    item: [module, version]
  gitignore.patterns:
    summary: A line of .gitignore for the files that a command of a feature makes, for example a folder of build output.
    file: go/.gitignore
    item: [pattern]

delimiters:
  - glob: "go/**/Taskfile*.yml"
    left: "[["
    right: "]]"
  - glob: "go/.github/**"
    left: "[["
    right: "]]"
