version: '3'

includes:
  migrate: Taskfile.migrate.yml
  test: Taskfile.test.yml
  api: Taskfile.api.yml
  catchup: Taskfile.catchup.yml
[[- range items "taskfile.includes" ]]
  [[ .name ]]: [[ .taskfile ]]
[[- end ]]
[[- range items "taskfile.flat_includes" ]]
  [[ .name ]]:
    taskfile: [[ .taskfile ]]
    flatten: true
[[- end ]]

tasks:
  test:shellcheck:
    cmds:
      - find ./scripts -type f -name '*.sh' | xargs shellcheck -S error
      - shellcheck -S error ./hooks/*
      - find . -maxdepth 1 -name '*.sh' -exec shellcheck -S error {} +

  hook:setup:
    cmds:
      - git config core.hooksPath ./hooks

  hook:validate-go-changes:
    cmds:
      - task: test:all

  db:cli:
    dotenv:
      - .env.local
    cmds:
      - |
        docker compose -p [[ kebab .Name ]]-local exec \
          db psql -U${DB_USERNAME} -d${DB_NAME}

  db:query:
    desc: example `task db:query -- 'select * from account_balances'`
    silent: true
    dotenv:
      - .env.local
    cmds:
      - |
        docker compose -p [[ kebab .Name ]]-local exec \
          db psql -U${DB_USERNAME} -d${DB_NAME} -c {{.CLI_ARGS}}

  run-dependencies:
    cmds:
      - docker compose --env-file .env.local -f docker-compose.dependencies.yml -p [[ kebab .Name ]]-local up -d --wait db[[ range items "taskfile.dependencies" ]] [[ .service ]][[ end ]]
      - docker compose --env-file .env.local -f docker-compose.dependencies.yml -p [[ kebab .Name ]]-local up --exit-code-from migrate migrate
      - command -v tmuxp && echo "tmuxp exists" || pip install tmuxp

  remove-dependencies:
    cmds:
      - docker compose --env-file .env.local -f docker-compose.dependencies.yml -p [[ kebab .Name ]]-local down

  run:
    deps:
      - run-dependencies
    cmds:
      - tmuxp load -a .tmuxp.yaml
