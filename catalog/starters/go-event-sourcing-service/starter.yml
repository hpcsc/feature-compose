summary: A Go service with an event store, an HTTP API, and a catchup process.

options:
  go-version:
    default: "1.27.1"
    pattern: '^1\.(2[7-9]|[3-9][0-9])(\.[0-9]+)?$'
  module:
    default: github.com/hpcsc/{{ .Name }}
    pattern: '^[A-Za-z0-9][A-Za-z0-9._~/-]*$'

folders:
  go:
    path: .
    after_render: [go mod tidy, gofmt -w .]
    test: [task test:unit]

extension_points:
  account.state:
    summary: A field of the Account aggregate, and a statement that Apply runs for each event after the events of the account. type can use uuid and the types of the package account. apply can use a, the *Account, and e, the domain.Event, and the methods that a file of the feature in the package account declares.
    file: go/internal/use_cases/account/account.go
    item: [name, type, apply]
  account.events:
    summary: The name of a payload type of the package event of the account, which RegisterEvents registers.
    file: go/internal/use_cases/account/events.go
    item: [event]
  balance.changes:
    summary: An event of the account that changes the balance in account_balances. event is the name of its payload type in the package event of the account, and that type has the field AccountID. amount is an expression of type int64 that the balance changes by, and it can use payload, the *event.<event>.
    file: go/internal/use_cases/account/balance/projection.go
    item: [event, amount]
  use_cases.events:
    summary: A statement of RegisterEvents that registers the event types of a domain. It can use reg, the *registry.OfEvents, and the functions that a feature declares in a file of its own in the package use_cases.
    file: go/internal/use_cases/register.go
    item: [code]
  use_cases.handlers:
    summary: A statement of RegisterHandlers that registers command handlers. It can use bus, the *command.Bus, stream, the event.Stream, and accounts, the *account.Repository, and the functions that a feature declares in a file of its own in the package use_cases.
    file: go/internal/use_cases/register.go
    item: [code]
  api.routes:
    summary: An expression of type []route.Routable, whose routes Register serves under /api as public or protected routes. It can use bus, the *command.Bus, pool, the *pgxpool.Pool, cfg, the *api.Config, the name of each item of api.workers, and the functions that a feature declares in a file of its own in the package use_cases of the API.
    file: go/internal/api/use_cases/register.go
    item: [code]
  api.workers:
    summary: A worker of the API. Register declares the variable name with the value code, an expression of a type with the methods of api.Worker, Name() string and Start(ctx context.Context) error. name is a Go name that no other variable of Register has, and an item of api.routes can use it. code can use cfg, the *api.Config, pool, the *pgxpool.Pool, logger, the *slog.Logger, reg, the *registry.OfEvents, and bus, the *command.Bus, and the functions that a feature declares in a file of its own in the package use_cases of the API. The API starts each worker when it starts. When it stops, after the HTTP server takes no new request, it ends the context of each worker and waits until Start returns. A worker whose Start returns an error stops the API, and the API logs the name of the worker with the error and exits with 1.
    file: go/internal/api/use_cases/register.go
    item: [name, code]
  api.middleware:
    summary: An expression of type func(http.Handler) http.Handler, which each request to a protected route goes through. It can use cfg, the *api.Config of the API. import is the path of its package under the module.
    file: go/internal/api/server/server.go
    item: [code, import]
  api.config:
    summary: A field of api.Config, whose type the config loader reads with its env tags. import is the path of the package of its type under the module.
    file: go/internal/api/config.go
    item: [name, type, import]
  catchup.config:
    summary: A field of the Config of catchup, whose type the config loader reads with its env tags. import is the path of the package of its type under the module.
    file: go/cmd/catchup/main.go
    item: [name, type, import]
  catchup.consumers:
    summary: An expression of type []worker, the consumers and the schedulers that catchup runs, each under the lock of its name. It can use pool, cfg, logger, reg, bus, eventStream, checkpointStore and eventSubscription, and the functions that a feature declares in a file of its own in the package main of cmd/catchup. A worker that cannot start returns an error from Start, and catchup then stops each worker, logs the name of the worker with the error, and exits with 1.
    file: go/cmd/catchup/main.go
    item: [code]

  api.tasks:
    summary: Tasks of Taskfile.api.yml, as YAML with each task name at the left edge. A task can use the var API, the base URL of the local API with /api.
    file: go/Taskfile.api.yml
    item: [text]
  readme.sections:
    summary: A section of the README after the sections of the starter, as Markdown that starts with a heading of level 2.
    file: go/README.md
    item: [text]
  taskfile.includes:
    summary: A Taskfile that Taskfile.yml includes. name is the namespace of its tasks, and taskfile is its path in the repo.
    file: go/Taskfile.yml
    item: [name, taskfile]
  taskfile.flat_includes:
    summary: A Taskfile of a feature that Taskfile.yml includes with flatten, so that its tasks keep their own names. name is the key of the include, and taskfile is its path in the repo. A task name of the Taskfile must not be a task name of the starter.
    file: go/Taskfile.yml
    item: [name, taskfile]
  mise.tools:
    summary: A tool that mise install installs, with the name that mise.toml gives it and a fixed version.
    file: go/mise.toml
    item: [name, version]
  ci.jobs:
    summary: A job of the CI workflow, as YAML with the job name at the left edge. needs can name test, the job of the starter that runs its tests. The workflow runs on each push, with the permissions of the starter, so a job that writes sets its own permissions.
    file: go/.github/workflows/ci.yml
    item: [text]
  gomod.requires:
    summary: A module that the Go code of a feature imports and that the starter does not require, with a fixed version, so that go mod tidy takes no latest version.
    file: go/go.mod
    item: [module, version]
  gitignore.patterns:
    summary: A line of .gitignore for the files that a command of a feature makes, for example a folder of build output.
    file: go/.gitignore
    item: [pattern]
  tmux.panes:
    summary: A command that task run runs in a pane of its tmux window, beside the API and catchup.
    file: go/.tmuxp.yaml
    item: [command]
  compose.catchup.environment:
    summary: A variable of the environment of the catchup service of docker-compose.local.yml.
    file: go/docker-compose.local.yml
    item: [name, value]
  compose.services:
    summary: A service of docker-compose.local.yml, as YAML with the service name at the left edge.
    file: go/docker-compose.local.yml
    item: [text]
  compose.dependencies.services:
    summary: A service of docker-compose.dependencies.yml, beside db and migrate, as YAML with the service name at the left edge. task run-dependencies and the integration tests read this file, the integration tests with the values of .env.integration. A port on the host comes from a variable of .env.local and of .env.integration.
    file: go/docker-compose.dependencies.yml
    item: [text]
  dotenv.local:
    summary: A variable of .env.local, which docker-compose.dependencies.yml reads for task run-dependencies.
    file: go/.env.local
    item: [name, value]
  dotenv.integration:
    summary: A variable of .env.integration, which task test:integration gives to the integration tests and which docker-compose.dependencies.yml reads for them.
    file: go/.env.integration
    item: [name, value]
  test.dependencies:
    summary: A service of docker-compose.dependencies.yml that the integration tests need beside db. scripts/test/start-test-dependencies.sh starts it and waits until it is healthy.
    file: go/scripts/test/start-test-dependencies.sh
    item: [service]

delimiters:
  - glob: "go/**/Taskfile*.yml"
    left: "[["
    right: "]]"
  - glob: "go/.github/**"
    left: "[["
    right: "]]"
