summary: A Go service with an event store, an HTTP API, and a catchup process.

options:
  go-version:
    default: "1.27.1"
    pattern: '^1\.(2[7-9]|[3-9][0-9])(\.[0-9]+)?$'
  module:
    default: github.com/hpcsc/{{ .Name }}
    pattern: '^[A-Za-z0-9][A-Za-z0-9._~/-]*$'

folders:
  go:
    path: .
    after_render: [go mod tidy, gofmt -w .]
    test: [task test:unit]

extension_points:
  account.state:
    summary: A field of the Account aggregate, and a statement that Apply runs for each event after the events of the account. type can use uuid and the types of the package account. apply can use a, the *Account, and e, the domain.Event, and the methods that a file of the feature in the package account declares.
    file: go/internal/use_cases/account/account.go
    item: [name, type, apply]
  account.events:
    summary: The name of a payload type of the package event of the account, which RegisterEvents registers.
    file: go/internal/use_cases/account/events.go
    item: [event]
  balance.changes:
    summary: An event of the account that changes the balance in account_balances. event is the name of its payload type in the package event of the account, and that type has the field AccountID. amount is an expression of type int64 that the balance changes by, and it can use payload, the *event.<event>.
    file: go/internal/use_cases/account/balance/projection.go
    item: [event, amount]
  use_cases.events:
    summary: A statement of RegisterEvents that registers the event types of a domain. It can use reg, the *registry.OfEvents, and the functions that a feature declares in a file of its own in the package use_cases.
    file: go/internal/use_cases/register.go
    item: [code]
  use_cases.handlers:
    summary: A statement of RegisterHandlers that registers command handlers. It can use bus, the *command.Bus, stream, the event.Stream, and accounts, the *account.Repository, and the functions that a feature declares in a file of its own in the package use_cases.
    file: go/internal/use_cases/register.go
    item: [code]
  api.routes:
    summary: An expression of type []route.Routable, whose routes Register serves under /api as public or protected routes. It can use bus, the *command.Bus, and pool, the *pgxpool.Pool, and the functions that a feature declares in a file of its own in the package use_cases of the API.
    file: go/internal/api/use_cases/register.go
    item: [code]
  api.middleware:
    summary: An expression of type func(http.Handler) http.Handler, which each request to a protected route goes through. It can use cfg, the *api.Config of the API. import is the path of its package under the module.
    file: go/internal/api/server/server.go
    item: [code, import]
  api.config:
    summary: A field of api.Config, whose type the config loader reads with its env tags. import is the path of the package of its type under the module.
    file: go/internal/api/config.go
    item: [name, type, import]
  catchup.config:
    summary: A field of the Config of catchup, whose type the config loader reads with its env tags. import is the path of the package of its type under the module.
    file: go/cmd/catchup/main.go
    item: [name, type, import]
  catchup.consumers:
    summary: An expression of type []worker, the consumers and the schedulers that catchup runs, each under the lock of its name. It can use pool, cfg, logger, reg, bus, eventStream, checkpointStore and eventSubscription, and the functions that a feature declares in a file of its own in the package main of cmd/catchup. A worker that cannot start returns an error from Start, and catchup then stops each worker, logs the name of the worker with the error, and exits with 1.
    file: go/cmd/catchup/main.go
    item: [code]

  taskfile.includes:
    summary: A Taskfile that Taskfile.yml includes. name is the namespace of its tasks, and taskfile is its path in the repo.
    file: go/Taskfile.yml
    item: [name, taskfile]
  tmux.panes:
    summary: A command that task run runs in a pane of its tmux window, beside the API and catchup.
    file: go/.tmuxp.yaml
    item: [command]
  compose.catchup.environment:
    summary: A variable of the environment of the catchup service of docker-compose.local.yml.
    file: go/docker-compose.local.yml
    item: [name, value]
  compose.services:
    summary: A service of docker-compose.local.yml, as YAML with the service name at the left edge.
    file: go/docker-compose.local.yml
    item: [text]

delimiters:
  - glob: "go/**/Taskfile*.yml"
    left: "[["
    right: "]]"
  - glob: "go/.github/**"
    left: "[["
    right: "]]"
