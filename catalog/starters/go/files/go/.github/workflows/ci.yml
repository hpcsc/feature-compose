name: CI

on:
  push: {}

permissions:
  contents: read

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Mise install
        uses: jdx/mise-action@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run shellcheck
        run: task test:shellcheck

      - name: Build
        run: go build ./...

      - name: Run Unit Test
        run: task test:unit

      - name: Run vulnerabilities check
        run: task test:vulnerabilities
