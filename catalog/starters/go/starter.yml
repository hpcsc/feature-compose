summary: A Go module with an example package, its unit tests, a pre-push hook, and a CI workflow.

options:
  go-version:
    default: "1.27.1"
    pattern: '^1\.(2[7-9]|[3-9][0-9])(\.[0-9]+)?$'
  module:
    default: github.com/hpcsc/{{ .Name }}
    pattern: '^[A-Za-z0-9][A-Za-z0-9._~/-]*$'

folders:
  go:
    path: .
    after_render: [go mod tidy, gofmt -w .]
    test: [task test:unit]

extension_points:
  taskfile.flat_includes:
    summary: A Taskfile of a feature that Taskfile.yml includes with flatten, so that its tasks keep their own names. name is the key of the include, and taskfile is its path in the repo. A task name of the Taskfile must not be a task name of the starter.
    file: go/Taskfile.yml
    item: [name, taskfile]
  mise.tools:
    summary: A tool that mise install installs, with the name that mise.toml gives it and a fixed version.
    file: go/mise.toml
    item: [name, version]
  gomod.requires:
    summary: A module that the Go code of a feature imports and that the starter does not require, with a fixed version, so that go mod tidy takes no latest version.
    file: go/go.mod
    item: [module, version]
  gitignore.patterns:
    summary: A line of .gitignore for the files that a command of a feature makes, for example a folder of build output.
    file: go/.gitignore
    item: [pattern]

delimiters:
  - glob: "go/**/Taskfile*.yml"
    left: "[["
    right: "]]"
  - glob: "go/.github/**"
    left: "[["
    right: "]]"
