design: planned
types:
  - name: Starter
    package: catalog
    change: changed
    does: one starter of the catalog, which each selection of a repo starts from
    owns:
      - each selected feature names the starter in its targets; any other name stops, and the message lists the features that target the starter
      - a feature that is given twice is selected once
      - each given value of a feature names an option of that feature; any other name stops, and the message lists the options of the feature
      - one extension point has one declarer among the starter and the selected features
      - each extension point in the add_to of a selected feature is declared by the starter or by a selected feature
    fields: [name, options, folders, templates, features, extensionPoints]
    methods: [Select]
  - name: Selection
    package: catalog
    change: changed
    does: makes one repo from a starter, the selected features with the values of their options, a name and the values of the starter options
    owns:
      - each path of the repo has one owner; two templates that write one path stop the write before the first file, and the message names both owners
      - items gives the items of an extension point that the starter or a selected feature declares, by the name of the feature that adds them and then in the order of its add_to; any other name stops the write before the first file
      - unique gives each value of one field of the items of one or more extension points one time, in the order in which the values first come
      - a template of a feature reads the options of its feature by their names, and the options of the starter as starter.<option>; a template of the starter reads only the options of the starter
    fields: [folders, name, values, templates, extensionPoints]
    methods: [Write, RunAfterRender]
  - name: feature
    package: catalog
    change: changed
    does: one feature.yml with the templates under its files entries, which a selection writes into the folders of the starter
    owns:
      - the first path segment of a template after the path of its files entry names a folder of the starter
      - the templates of a feature render with the delimiters of its own feature.yml, and never with those of the starter
    fields: [name, templates, rules, options, extensionPoints, addTo]
    methods: []
  - name: extensionPoint
    package: catalog
    change: new
    does: a named list in one file, which the starter or a feature declares with the fields of its items
    owns:
      - each item has exactly the fields that the extension point declares; an item with a missing or an extra field stops the selection, and the message names the feature, the extension point and the fields
    fields: [name, declarer, itemFields, items]
    methods: [add]
  - name: option
    package: catalog
    change: changed
    does: one question of a starter or a feature, with its default, and its pattern or its accepted values
    owns:
      - a value matches the pattern, when the option has one
      - a value is one of the accepted values, when the option has them; another value stops, and the message names the option and its values
    fields: [name, defaultValue, pattern, accepted]
    methods: [check]
functions:
  - New(files fs.FS) Catalog
  - Embedded() Catalog
words:
  - concept: a selected feature gives items to an extension point of the starter or of a selected feature, in its add_to
    word: add
    not: [contribute, inject, register, append, plug in]
  - concept: the starter or the one feature that names an extension point in its definition
    word: declarer
    not: [owner, provider, host]
  - concept: the values that an option accepts, written as values in feature.yml and in the messages
    word: accepted values
    not: [choices, enum, allowed, options]
  - concept: each value of one field across the items of extension points, one time each
    word: unique
    not: [distinct, dedupe, set]
  - concept: how the API of a repo checks a credential; api-key in this story
    word: method
    not: [mode, strategy, provider, scheme]
  - concept: the secret that a client of the API sends as Authorization Bearer <key>, with the method api-key
    word: key
    not: [token, secret, password, api token]
  - concept: the hex form of the SHA-256 hash of a key, which the config of the API holds in API_KEY_HASHES
    word: key hash
    not: [digest, fingerprint, checksum, hashed key]
  - concept: a route of the API that a request reaches only through the items of api.middleware
    word: protected route
    not: [private route, secured route, authenticated route]
dependencies:
  - internal/cmd -> catalog
